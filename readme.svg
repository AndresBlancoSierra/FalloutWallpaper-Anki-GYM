<text x="340" y="235" fill="#f4f4f5" font-size="16" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="340" y="235" class="glitch" fill="#f4f4f5">~/</tspan><tspan class="glitch" fill="#f4f4f5">FalloutWallpaper-Anki-GYM</tspan><tspan class="cursor" fill="#71717a">▌</tspan><tspan fill="#a1a1aa"> ───────────────────────────</tspan><tspan x="340" y="265" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">About</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Pip-Boy live wallpaper for Hyprland merging /</tspan><tspan x="368.8" y="289" fill="#f4f4f5">real life with stats: gym routine, volleyball,</tspan><tspan x="368.8" y="313" fill="#f4f4f5">/ meditation, drawing, cold shower, reading</tspan><tspan x="368.8" y="337" fill="#f4f4f5">and / Anki review — with full-desktop ERROR</tspan><tspan x="368.8" y="361" fill="#f4f4f5">mode.</tspan><tspan x="340" y="385" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Type</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Desktop · wallpaper</tspan><tspan x="340" y="409" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Lang</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">HTML</tspan><tspan x="340" y="433" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Status</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Active</tspan><tspan x="340" y="457" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Author</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Andrés Blanco</tspan><tspan x="340" y="481" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Frontend</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">fallout-stats.html + img/</tspan><tspan x="340" y="505" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Server</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">serve.py + eww overlay</tspan><tspan x="340" y="529" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Sync</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">AnkiConnect (60s)</tspan><tspan x="340" y="553" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">WM</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Hyprland + hyprwinwrap</tspan><tspan x="340" y="583" fill="#f4f4f5"> ─── GitHub Stats ───</tspan><tspan x="340" y="607" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Stars</tspan><tspan fill="#a1a1aa">:   0</tspan><tspan fill="#a1a1aa">   </tspan><tspan fill="#f4f4f5">Forks</tspan><tspan fill="#a1a1aa">:   0</tspan><tspan x="340" y="631" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Issues</tspan><tspan fill="#a1a1aa">:   0</tspan><tspan fill="#a1a1aa">   </tspan><tspan fill="#71717a">STATUS</tspan><tspan fill="#f4f4f5">: Active</tspan></text>

<g id="features"><text x="40" y="751" fill="#f4f4f5" font-weight="bold">FalloutWallpaper-Anki-GYM@arch:~$</text><text x="356.8" y="751" fill="#71717a" font-weight="bold"># features</text><text x="60" y="799" fill="#71717a">▸ </text><text x="79.2" y="799" fill="#f4f4f5">Animated Pip-Boy with GYM mode (Push/Pull/Leg + BREAK on Sunday)</text><text x="60" y="823" fill="#71717a">▸ </text><text x="79.2" y="823" fill="#f4f4f5">Streaks 0–365 for GYM, VOLLEY, MEDITATION, DRAW, COOL SHOWER, READ</text><text x="60" y="847" fill="#71717a">▸ </text><text x="79.2" y="847" fill="#f4f4f5">READ mode with your Obsidian book list (checkboxes)</text><text x="60" y="871" fill="#71717a">▸ </text><text x="79.2" y="871" fill="#f4f4f5">AnkiConnect sync every 60s (German + Hackerman decks)</text><text x="60" y="895" fill="#71717a">▸ </text><text x="79.2" y="895" fill="#f4f4f5">Full-desktop ERROR mode until all daily tasks are done</text><text x="60" y="919" fill="#71717a">▸ </text><text x="79.2" y="919" fill="#f4f4f5">Auto-start via Hyprland autostart.conf</text></g><g id="stack"><text x="40" y="1017" fill="#f4f4f5" font-weight="bold">FalloutWallpaper-Anki-GYM@arch:~$</text><text x="356.8" y="1017" fill="#71717a" font-weight="bold"># stack</text><text x="60" y="1065" fill="#f4f4f5">HTML/CSS/JS · Python (serve.py) · eww overlays · ImageMagick · AnkiConnect</text></g><g id="run"><text x="40" y="1163" fill="#f4f4f5" font-weight="bold">FalloutWallpaper-Anki-GYM@arch:~$</text><text x="356.8" y="1163" fill="#71717a" font-weight="bold"># run</text><text x="60" y="1211" fill="#52525b">$ </text><text x="79.2" y="1211" fill="#f4f4f5">Hyprland autostart.conf: serve + launch wallpaper</text><text x="60" y="1235" fill="#52525b">$ </text><text x="79.2" y="1235" fill="#f4f4f5">⟳ refresh button in the daily status bar</text><text x="60" y="1259" fill="#52525b">$ </text><text x="79.2" y="1259" fill="#f4f4f5">systemd/ — user units</text></g><g id="tree"><text x="40" y="1357" fill="#f4f4f5" font-weight="bold">