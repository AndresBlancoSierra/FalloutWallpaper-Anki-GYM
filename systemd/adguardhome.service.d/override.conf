# VAULT-TEC FOCUS — AdGuard nunca debe quedar caído (fail-closed).
#
# Si adguardhome muere, systemd lo relanza de inmediato. La capa DNS sigue
# apuntando a 127.0.0.1 (zzz-vaulttec-focus.conf) y FallbackDNS= está vacío,
# así que mientras no levante no hay DNS y el bloqueo se mantiene (fail-closed).
# El refresh (vaulttec-focus-refresh.service) además lo reinicia si se cae y
# re-aplica las user_rules.

[Service]
Restart=always
RestartSec=10
