# VAULT-TEC — fragmento para ~/.config/hypr/hyprland.conf
#
# Hace que la ventana del wallpaper (Brave en modo app, class
# org.fallout.wallpaper, lanzada por launcher/fallout.py) funcione como fondo
# de pantalla HTML detrás de todas las ventanas (plugin hyprwinwrap) y no robe
# el foco. Recarga los plugins de hyprpm al arrancar.
#
# NOTA: "REPO_PATH" se sustituye por la ruta real del checkout al instalar.

exec-once = hyprpm reload

windowrule = no_focus on, match:class (org.fallout.wallpaper)
windowrule = no_initial_focus on, match:class (org.fallout.wallpaper)

plugin {
    hyprwinwrap {
        class = org.fallout.wallpaper
        pos_x = 0
        pos_y = 0
        size_x = 100
        size_y = 100
    }
}