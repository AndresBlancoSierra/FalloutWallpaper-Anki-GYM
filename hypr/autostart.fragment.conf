# VAULT-TEC — fragmento para ~/.config/hypr/autostart.conf
#
# Levanta el wallpaper de Fallout al iniciar la sesión de Hyprland:
#   1. serve.py     sirve fallout-stats.html + img/ y expone las APIs
#                   (/api/gym, /api/points, /api/alert).
#   2. fallout.py   lanza/ancla Brave en modo app; hyprwinwrap lo coloca de
#                   fondo y lo relanza si la ventana muere.
#
# Los repositorios por defecto que usa serve.py (GYM vault y points.md de
# Obsidian) se configuran con variables de entorno; ver docs/INSTALL.md.
#
# NOTA: "REPO_PATH" se sustituye por la ruta real del checkout al instalar.

exec-once = sleep 3 && FALLOUT_WEB_ROOT="REPO_PATH" python3 "REPO_PATH/server/serve.py"
exec-once = sleep 8 && python3 "REPO_PATH/launcher/fallout.py"